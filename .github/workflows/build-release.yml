name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      # Build de release SEM assinatura (sem keystore configurado ainda).
      # Já sai com minify/shrink ativados (isMinifyEnabled = true).
      - name: Build APK de release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: evolux-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
