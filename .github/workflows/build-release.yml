name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Decodificar keystore (se configurado)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
            echo "Keystore decodificado."
          else
            echo "Sem KEYSTORE_BASE64 configurado — build vai sair sem assinatura."
          fi

      # Build de release. Sai assinado se os 4 secrets (KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) estiverem configurados
      # em Settings > Secrets and variables > Actions. Sem eles, sai sem assinatura.
      - name: Build APK de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "${{ github.workspace }}/release.keystore" ]; then
            export KEYSTORE_PATH="${{ github.workspace }}/release.keystore"
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: evolux-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
